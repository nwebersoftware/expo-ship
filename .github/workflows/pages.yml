name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Internal notes live in the private repo nwebersoftware/booleanbuild-plan.
      # Never publish them (or stray draft assets) to the public site.
      - name: Strip internal files from the published artifact
        run: |
          rm -rf internal README.md PLAN.md SUBSCRIBE.md
          find . -maxdepth 1 -name '_*.png' -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell IndexNow (Bing/Yandex/Seznam - Google ignores it) to re-crawl. Best effort:
      # a failure here must never fail the deploy.
      - name: Announce the deploy to IndexNow
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{"host":"booleanbuild.com","key":"5cb7d64c14cd9c2129d72e595286e366","keyLocation":"https://booleanbuild.com/5cb7d64c14cd9c2129d72e595286e366.txt","urlList":["https://booleanbuild.com/sitemap.xml"]}' \
            -o /dev/null -w "indexnow: %{http_code}\n"
